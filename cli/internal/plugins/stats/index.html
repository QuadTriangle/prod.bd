<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>prod.bd — Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8fafc; --surface: rgba(255,255,255,.8); --border: #e2e8f0;
    --text: #0f172a; --muted: #64748b; --dim: #cbd5e1;
    --green: #16a34a; --red: #dc2626; --yellow: #ca8a04;
    --blue: #2563eb; --orange: #ea580c; --purple: #7c3aed;
    --header-bg: rgba(248,250,252,.9); --input-bg: #e2e8f0; --input-text: #334155;
    --hover-bg: rgba(226,232,240,.4); --td-border: rgba(226,232,240,.6);
    --pre-bg: rgba(241,245,249,.9); --port-bg: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #030712; --surface: rgba(17,24,39,.5); --border: #1f2937;
    --text: #f9fafb; --muted: #6b7280; --dim: #374151;
    --green: #22c55e; --red: #ef4444; --yellow: #eab308;
    --blue: #3b82f6; --orange: #f97316; --purple: #a78bfa;
    --header-bg: rgba(3,7,18,.8); --input-bg: #1f2937; --input-text: #d1d5db;
    --hover-bg: rgba(31,41,55,.3); --td-border: rgba(31,41,55,.5);
    --pre-bg: rgba(17,24,39,.8); --port-bg: #1f2937;
  }
  body { background: var(--bg); color: var(--text); min-height: 100vh; }
  code, .mono { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; }

  header { border-bottom: 1px solid var(--border); background: var(--header-bg);
    backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 40; }
  .header-inner { max-width: 1600px; margin: 0 auto; padding: .75rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: .5rem; text-decoration: none; }
  .logo span { font-size: 1.1rem; font-weight: 700; color: var(--green); }
  .header-right { display: flex; align-items: center; gap: .75rem; }
  .conn-badge { display: flex; align-items: center; gap: .4rem; font-size: .75rem; padding: .25rem .5rem; border-radius: .25rem; }
  .conn-dot { width: 6px; height: 6px; border-radius: 50%; }
  .conn-ok { color: var(--green); } .conn-ok .conn-dot { background: var(--green); }
  .conn-err { color: var(--red); } .conn-err .conn-dot { background: var(--red); }
</style>
<style>
  .btn { padding: .375rem .75rem; border-radius: .5rem; font-size: .75rem;
    border: none; cursor: pointer; transition: background .15s; }
  .btn-live { background: rgba(34,197,94,.15); color: var(--green); }
  .btn-paused { background: var(--dim); color: var(--muted); }
  .btn-default { background: var(--input-bg); color: var(--input-text); }
  .btn-default:hover { background: var(--dim); }
  .btn-send { background: var(--green); color: #fff; padding: .5rem 1.25rem; border-radius: .5rem;
    font-size: .8rem; font-weight: 600; border: none; cursor: pointer; white-space: nowrap; }
  .btn-send:hover { opacity: .9; }
  .btn-send:disabled { opacity: .5; cursor: not-allowed; }
  .btn-sm { padding: .25rem .5rem; font-size: .7rem; border-radius: .375rem; border: none; cursor: pointer; }
  .btn-danger { background: rgba(239,68,68,.15); color: var(--red); }
  .btn-danger:hover { background: rgba(239,68,68,.25); }
  .btn-icon { background: none; border: 1px solid var(--border); border-radius: .375rem;
    width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: .75rem; color: var(--muted); }
  .btn-icon:hover { border-color: var(--muted); color: var(--text); }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

  .container { max-width: 1600px; margin: 0 auto; padding: 1.5rem; }
  .grid-summary { display: grid; grid-template-columns: repeat(6,1fr); gap: .75rem; margin-bottom: 1.5rem; }
  .main-layout { display: flex; gap: 1.5rem; }
  .sidebar { width: 280px; flex-shrink: 0; }
  .content { flex: 1; min-width: 0; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: .75rem; padding: 1rem; }
  .card-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .25rem; }
  .card-value { font-size: 1.25rem; font-weight: 700; font-family: 'SF Mono', monospace; }

  .tunnel-btn { width: 100%; text-align: left; padding: .75rem; border-radius: .75rem;
    border: 1px solid var(--border); background: var(--surface); cursor: pointer;
    transition: border-color .15s; margin-bottom: .5rem; color: var(--text); }
  .tunnel-btn:hover { border-color: var(--dim); }
  .tunnel-btn.active { background: rgba(34,197,94,.08); border-color: rgba(34,197,94,.3); }
  .tunnel-name { font-weight: 700; font-size: .875rem; font-family: 'SF Mono', monospace; }
  .tunnel-port { font-size: .7rem; background: var(--port-bg); color: var(--muted); padding: .1rem .4rem; border-radius: .25rem; }
  .tunnel-meta { display: flex; gap: .75rem; font-size: .7rem; color: var(--muted); margin-top: .25rem; }

  .mini-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: .75rem; }
  .mini-label { font-size: .7rem; color: var(--muted); }
  .mini-value { font-size: .875rem; font-weight: 700; font-family: 'SF Mono', monospace; }

  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: .75rem; overflow: hidden; margin-top: 1rem; }
  .table-header { padding: 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
  .table-title { font-size: .875rem; font-weight: 500; color: var(--input-text); }
  .filter-input { background: var(--input-bg); border: 1px solid var(--dim); border-radius: .5rem;
    padding: .375rem .75rem; font-size: .75rem; color: var(--input-text); outline: none; }
  .filter-input:focus { border-color: var(--green); }
  select.filter-input { padding: .375rem .5rem; }
  table { width: 100%; font-size: .875rem; border-collapse: collapse; }
  th { text-align: left; padding: .5rem 1rem; font-size: .7rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); font-weight: 500; }
  td { padding: .5rem 1rem; border-bottom: 1px solid var(--td-border); }
  tr:hover td { background: var(--hover-bg); }
  tr.clickable { cursor: pointer; }
  .method-badge { padding: .1rem .4rem; border-radius: .25rem; font-size: .7rem;
    font-family: 'SF Mono', monospace; font-weight: 700; }
  .m-GET { background: rgba(59,130,246,.15); color: var(--blue); }
  .m-POST { background: rgba(34,197,94,.15); color: var(--green); }
  .m-PUT { background: rgba(234,179,8,.15); color: var(--yellow); }
  .m-PATCH { background: rgba(249,115,22,.15); color: var(--orange); }
  .m-DELETE { background: rgba(239,68,68,.15); color: var(--red); }
  .m-HEAD { background: rgba(124,58,237,.15); color: var(--purple); }
  .m-OPTIONS { background: rgba(124,58,237,.15); color: var(--purple); }
  .s-2xx { color: var(--green); } .s-3xx { color: var(--yellow); }
  .s-4xx { color: var(--orange); } .s-5xx { color: var(--red); }
  .empty-row { text-align: center; color: var(--dim); padding: 2rem; }
  .text-muted { color: var(--muted); } .text-dim { color: var(--dim); }
  .text-red { color: var(--red); } .text-green { color: var(--green); }
  .link { color: var(--green); text-decoration: none; font-family: 'SF Mono', monospace; font-size: .875rem; }
  .link:hover { color: #4ade80; }
</style>
<style>
  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100;
    display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .modal { background: var(--bg); border: 1px solid var(--border); border-radius: .75rem;
    width: 90vw; max-width: 900px; max-height: 85vh; display: flex; flex-direction: column; }
  .modal-head { display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
  .modal-head-title { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
  .modal-close { background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 1.25rem; padding: .25rem; line-height: 1; }
  .modal-close:hover { color: var(--text); }
  .modal-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 1.25rem; }
  .modal-tab { padding: .5rem 1rem; font-size: .75rem; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none; }
  .modal-tab:hover { color: var(--text); }
  .modal-tab.active { color: var(--green); border-bottom-color: var(--green); }
  .modal-body { flex: 1; overflow-y: auto; padding: 1.25rem; }
  .hdr-table { width: 100%; font-size: .8rem; border-collapse: collapse; }
  .hdr-table td { padding: .3rem .5rem; border-bottom: 1px solid var(--td-border); vertical-align: top; }
  .hdr-key { color: var(--green); font-family: 'SF Mono', monospace; white-space: nowrap; width: 30%; }
  .hdr-val { color: var(--input-text); font-family: 'SF Mono', monospace; word-break: break-all; }
  .body-pre { background: var(--pre-bg); border: 1px solid var(--border); border-radius: .5rem;
    padding: 1rem; font-family: 'SF Mono', monospace; font-size: .8rem; color: var(--input-text);
    white-space: pre-wrap; word-break: break-all; overflow-x: auto; max-height: 50vh; }
  .body-empty { color: var(--dim); font-size: .875rem; padding: 2rem; text-align: center; }
  .btn-theme { background: none; border: 1px solid var(--border); border-radius: .5rem;
    width: 30px; height: 30px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: .9rem; transition: border-color .15s; }
  .btn-theme:hover { border-color: var(--muted); }

  /* Content tabs */
  .content-tabs { display: flex; gap: 0; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .content-tab { padding: .5rem 1rem; font-size: .8rem; color: var(--muted); cursor: pointer;
    border: none; background: none; border-bottom: 2px solid transparent; }
  .content-tab:hover { color: var(--text); }
  .content-tab.active { color: var(--green); border-bottom-color: var(--green); }

  /* Composer */
  .composer { background: var(--surface); border: 1px solid var(--border); border-radius: .75rem; padding: 1.25rem; margin-top: 1rem; }
  .composer-row { display: flex; gap: .5rem; margin-bottom: .75rem; align-items: center; }
  .composer-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .25rem; }
  .composer textarea { width: 100%; min-height: 6rem; background: var(--input-bg); border: 1px solid var(--dim);
    border-radius: .5rem; padding: .5rem .75rem; font-family: 'SF Mono', monospace; font-size: .8rem;
    color: var(--input-text); resize: vertical; outline: none; }
  .composer textarea:focus { border-color: var(--green); }
  .resp-panel { margin-top: 1rem; border-top: 1px solid var(--border); padding-top: 1rem; }

  /* KV pair editor */
  .kv-row { display: flex; gap: .375rem; align-items: center; margin-bottom: .375rem; }
  .kv-row input { flex: 1; background: var(--input-bg); border: 1px solid var(--dim); border-radius: .375rem;
    padding: .3rem .5rem; font-size: .75rem; color: var(--input-text); outline: none; font-family: 'SF Mono', monospace; }
  .kv-row input:focus { border-color: var(--green); }
  .kv-toggle { width: 16px; height: 16px; accent-color: var(--green); cursor: pointer; }
  .kv-remove { background: none; border: none; color: var(--dim); cursor: pointer; font-size: .875rem; padding: 0 .25rem; }
  .kv-remove:hover { color: var(--red); }
  .kv-add { background: none; border: 1px dashed var(--dim); border-radius: .375rem; padding: .3rem .75rem;
    font-size: .7rem; color: var(--muted); cursor: pointer; width: 100%; text-align: left; }
  .kv-add:hover { border-color: var(--green); color: var(--green); }

  /* Intercepts */
  .intercept-card { background: var(--surface); border: 1px solid var(--border); border-radius: .75rem;
    padding: .75rem 1rem; margin-bottom: .5rem; display: flex; align-items: center; gap: .75rem; }
  .intercept-card.disabled { opacity: .5; }
  .intercept-info { flex: 1; min-width: 0; }
  .intercept-pattern { font-family: 'SF Mono', monospace; font-size: .8rem; color: var(--green); }
  .intercept-action { font-size: .7rem; padding: .1rem .4rem; border-radius: .25rem; font-weight: 600; }
  .ia-pause { background: rgba(234,179,8,.15); color: var(--yellow); }
  .ia-modify-request { background: rgba(59,130,246,.15); color: var(--blue); }
  .ia-modify-response { background: rgba(249,115,22,.15); color: var(--orange); }
  .ia-mock { background: rgba(124,58,237,.15); color: var(--purple); }
  .paused-banner { background: rgba(234,179,8,.1); border: 1px solid rgba(234,179,8,.3); border-radius: .5rem;
    padding: .75rem 1rem; margin-bottom: .5rem; }
  .paused-banner-head { display: flex; align-items: center; justify-content: space-between; }
  .paused-detail { margin-top: .5rem; font-size: .75rem; }

  /* Saved requests sidebar */
  .saved-item { display: flex; align-items: center; gap: .5rem; padding: .5rem .75rem; border-radius: .5rem;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface); margin-bottom: .375rem; }
  .saved-item:hover { border-color: var(--dim); }
  .saved-item .method-badge { font-size: .6rem; }
  .saved-name { flex: 1; font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saved-delete { background: none; border: none; color: var(--dim); cursor: pointer; font-size: .75rem; }
  .saved-delete:hover { color: var(--red); }

  /* Toast */
  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--surface); border: 1px solid var(--border);
    border-radius: .5rem; padding: .5rem 1rem; font-size: .8rem; z-index: 200; box-shadow: 0 4px 12px rgba(0,0,0,.15);
    transition: opacity .3s; }
  .toast.hidden { opacity: 0; pointer-events: none; }

  @media (max-width: 1024px) {
    .grid-summary { grid-template-columns: repeat(3,1fr); }
    .mini-grid { grid-template-columns: repeat(3,1fr); }
    .main-layout { flex-direction: column; }
    .sidebar { width: 100%; }
    .modal { width: 96vw; max-height: 90vh; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div style="display:flex;align-items:center;gap:.75rem">
      <a target="_blank" href="https://prod.bd" class="logo"><span>prod.bd</span></a>
      <span style="color:var(--dim)">/</span>
      <span style="color:var(--muted);font-size:.875rem">Dashboard</span>
    </div>
    <div class="header-right">
      <div id="conn-badge" class="conn-badge conn-err"><div class="conn-dot"></div><span>CLI offline</span></div>
      <button id="btn-live" class="btn btn-paused" onclick="toggleAutoRefresh()">
        <span style="display:inline-flex;align-items:center;gap:.4rem">
          <span id="live-dot" class="conn-dot" style="background:var(--muted)"></span>
          <span id="live-text">Paused</span>
        </span>
      </button>
      <button class="btn btn-default" onclick="refresh()">↻ Refresh</button>
      <button id="btn-theme" class="btn-theme" onclick="toggleTheme()" aria-label="Toggle theme">☀️</button>
    </div>
  </div>
</header>
<div class="container">
  <div id="loading" style="display:flex;align-items:center;justify-content:center;height:16rem">
    <span style="color:var(--muted)">Connecting to CLI stats server...</span>
  </div>
  <div id="offline" style="display:none;text-align:center;padding:4rem 0">
    <div style="color:var(--muted);font-size:1.1rem;margin-bottom:.5rem">CLI not running</div>
    <div style="color:var(--dim);font-size:.875rem;margin-bottom:1rem">Start a tunnel to see live stats:</div>
    <code style="background:var(--input-bg);padding:.5rem 1rem;border-radius:.5rem;color:var(--green);font-size:.875rem">prod 3000</code>
  </div>
  <div id="app" style="display:none">
    <div id="summary-cards" class="grid-summary"></div>
    <div class="main-layout">
      <div class="sidebar">
        <div style="font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem;padding:0 .25rem">Tunnels</div>
        <div id="tunnel-list"></div>
      </div>
      <div class="content" id="main-content">
        <div id="no-selection" style="display:flex;align-items:center;justify-content:center;height:16rem;background:var(--surface);border-radius:.75rem;border:1px solid var(--border)">
          <div style="text-align:center"><div style="color:var(--dim);font-size:1.1rem;margin-bottom:.25rem">Select a tunnel</div><div style="color:var(--dim);font-size:.875rem">Pick a tunnel from the sidebar to view its stats</div></div>
        </div>
        <div id="tunnel-detail" style="display:none">
          <div class="content-tabs">
            <button class="content-tab active" onclick="switchContentTab('requests')">Requests</button>
            <button class="content-tab" onclick="switchContentTab('composer')">Composer</button>
            <button class="content-tab" onclick="switchContentTab('intercepts')">Intercepts</button>
          </div>
          <div id="tab-requests"></div>
          <div id="tab-composer" style="display:none"></div>
          <div id="tab-intercepts" style="display:none"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="modal-root" style="display:none"></div>
<div id="toast" class="toast hidden"></div>
<script>
const API = '';
let autoRefresh = false, intervalId = null, selectedTunnel = null;
let tunnels = [], requests = [], summary = null, connected = false;
let contentTab = 'requests';
let interceptRules = [], pausedReqs = {};
let savedRequests = [];
let composerResult = null;
let composerSending = false;

// Composer state with KV pairs
let comp = {
  method: 'GET', path: '/',
  params: [{key:'',value:'',enabled:true}],
  headers: [{key:'',value:'',enabled:true}],
  bodyType: 'none', // none, json, form, raw
  body: '',
  name: '' // for saving
};

// --- Utilities ---
function formatBytes(b) {
  if (b === 0) return '0 B';
  const k = 1024, s = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(b) / Math.log(k));
  return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + s[i];
}
function formatLatency(ms) {
  if (ms < 1) return '<1ms';
  if (ms < 1000) return Math.round(ms) + 'ms';
  return (ms / 1000).toFixed(2) + 's';
}
function timeAgo(unix) {
  const d = Math.floor(Date.now() / 1000) - unix;
  if (d < 60) return d + 's ago';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  return Math.floor(d / 86400) + 'd ago';
}
function statusClass(s) {
  if (s < 300) return 's-2xx'; if (s < 400) return 's-3xx';
  if (s < 500) return 's-4xx'; return 's-5xx';
}
function methodClass(m) { return 'm-' + m; }
function esc(s) { if (s == null) return ''; const d = document.createElement('div'); d.textContent = String(s); return d.innerHTML; }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 2500);
}
function contentTypeShort(ct) {
  if (!ct) return '';
  if (ct.includes('json')) return 'JSON';
  if (ct.includes('html')) return 'HTML';
  if (ct.includes('xml')) return 'XML';
  if (ct.includes('css')) return 'CSS';
  if (ct.includes('javascript')) return 'JS';
  if (ct.includes('image')) return 'IMG';
  if (ct.includes('text')) return 'TXT';
  return ct.split(';')[0].split('/').pop().toUpperCase().slice(0,6);
}

// --- Data fetching ---
async function fetchAll() {
  try {
    const [tRes, sRes] = await Promise.all([
      fetch(API + '/api/stats/tunnels'), fetch(API + '/api/stats/summary')
    ]);
    tunnels = (await tRes.json()).tunnels || [];
    summary = (await sRes.json()).summary || null;
    connected = true;
  } catch { connected = false; }
  render();
}

async function fetchRequests(sub) {
  try {
    const r = await fetch(API + '/api/stats/requests?subdomain=' + sub + '&limit=200');
    requests = (await r.json()).requests || [];
  } catch { requests = []; }
  if (contentTab === 'requests') renderDetail();
}

async function fetchSaved() {
  try {
    const r = await fetch(API + '/api/stats/saved');
    savedRequests = (await r.json()).saved || [];
  } catch { savedRequests = []; }
}

async function fetchIntercepts() {
  try {
    const [rRes, pRes] = await Promise.all([
      fetch(API + '/api/stats/intercepts'),
      fetch(API + '/api/stats/paused')
    ]);
    interceptRules = (await rRes.json()).rules || [];
    const raw = (await pRes.json()).paused || {};
    pausedReqs = raw;
  } catch {}
  renderIntercepts();
}
</script>
<script>
// --- Main render ---
function render() {
  const loading = document.getElementById('loading');
  const offline = document.getElementById('offline');
  const app = document.getElementById('app');
  const badge = document.getElementById('conn-badge');

  loading.style.display = 'none';
  if (!connected) {
    offline.style.display = 'block'; app.style.display = 'none';
    badge.className = 'conn-badge conn-err';
    badge.querySelector('span').textContent = 'CLI offline';
    return;
  }
  offline.style.display = 'none'; app.style.display = 'block';
  badge.className = 'conn-badge conn-ok';
  badge.querySelector('span').textContent = 'Connected';

  if (summary) {
    document.getElementById('summary-cards').innerHTML = [
      ['Active Tunnels', summary.active_tunnels, ''],
      ['Total Requests', summary.total_requests.toLocaleString(), ''],
      ['Errors', summary.total_errors, summary.total_errors > 0 ? 'text-red' : ''],
      ['Avg Latency', formatLatency(summary.avg_latency || 0), ''],
      ['Traffic In', formatBytes(summary.total_bytes_in || 0), ''],
      ['Traffic Out', formatBytes(summary.total_bytes_out || 0), ''],
    ].map(([l,v,c]) => `<div class="card"><div class="card-label">${l}</div><div class="card-value ${c}">${v}</div></div>`).join('');
  }

  const list = document.getElementById('tunnel-list');
  if (tunnels.length === 0) {
    list.innerHTML = '<div class="card" style="color:var(--dim);font-size:.875rem">No active tunnels</div>';
  } else {
    list.innerHTML = tunnels.map(t => `
      <button class="tunnel-btn ${selectedTunnel === t.subdomain ? 'active' : ''}" onclick="selectTunnel('${t.subdomain}')">
        <div style="display:flex;align-items:center;gap:.5rem">
          <span class="tunnel-name">${esc(t.subdomain)}</span>
          <span class="tunnel-port">:${t.port}</span>
        </div>
        <div class="tunnel-meta">
          <span>${t.total_requests} reqs</span>
          ${t.error_count > 0 ? '<span class="text-red">' + t.error_count + ' err</span>' : ''}
          <span>${formatLatency(t.avg_latency)}</span>
        </div>
      </button>
    `).join('');
  }

  if (!selectedTunnel) {
    document.getElementById('no-selection').style.display = 'flex';
    document.getElementById('tunnel-detail').style.display = 'none';
  } else {
    document.getElementById('no-selection').style.display = 'none';
    document.getElementById('tunnel-detail').style.display = 'block';
    if (contentTab === 'requests') renderDetail();
    else if (contentTab === 'composer') renderComposer();
    else if (contentTab === 'intercepts') fetchIntercepts();
  }
}

function selectTunnel(sub) {
  selectedTunnel = sub;
  fetchRequests(sub);
  render();
}

function switchContentTab(tab) {
  contentTab = tab;
  document.querySelectorAll('.content-tab').forEach((el, i) => {
    const tabs = ['requests','composer','intercepts'];
    el.classList.toggle('active', tabs[i] === tab);
  });
  document.getElementById('tab-requests').style.display = tab === 'requests' ? '' : 'none';
  document.getElementById('tab-composer').style.display = tab === 'composer' ? '' : 'none';
  document.getElementById('tab-intercepts').style.display = tab === 'intercepts' ? '' : 'none';
  if (tab === 'intercepts') fetchIntercepts();
  if (tab === 'requests') renderDetail();
  if (tab === 'composer') { fetchSaved(); renderComposer(); }
}

// --- Requests tab ---
function renderDetail() {
  const t = tunnels.find(x => x.subdomain === selectedTunnel);
  if (!t) return;
  const total = t.total_bytes_in + t.total_bytes_out;
  const errRate = t.total_requests > 0 ? ((t.error_count / t.total_requests) * 100).toFixed(1) + '%' : '0%';

  const filterMethod = document.getElementById('filter-method')?.value || 'ALL';
  const filterStatus = document.getElementById('filter-status')?.value || 'ALL';
  const searchPath = document.getElementById('filter-path')?.value || '';

  const filtered = requests.filter(r => {
    if (filterMethod !== 'ALL' && r.method !== filterMethod) return false;
    if (filterStatus === '2xx' && (r.status < 200 || r.status >= 300)) return false;
    if (filterStatus === '3xx' && (r.status < 300 || r.status >= 400)) return false;
    if (filterStatus === '4xx' && (r.status < 400 || r.status >= 500)) return false;
    if (filterStatus === '5xx' && r.status < 500) return false;
    if (searchPath && !r.path.toLowerCase().includes(searchPath.toLowerCase())) return false;
    return true;
  });

  document.getElementById('tab-requests').innerHTML = `
    <div class="card" style="padding:1.25rem">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem">
        <div>
          <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.25rem">
            <span style="font-size:1.25rem;font-weight:700" class="mono">${esc(t.subdomain)}</span>
            <span class="tunnel-port">:${t.port}</span>
          </div>
          <a href="https://${esc(t.subdomain)}.prod.bd" target="_blank" rel="noopener" class="link">${esc(t.subdomain)}.prod.bd ↗</a>
        </div>
      </div>
      <div class="mini-grid">
        <div><div class="mini-label">Requests</div><div class="mini-value">${t.total_requests.toLocaleString()}</div></div>
        <div><div class="mini-label">Errors</div><div class="mini-value ${t.error_count > 0 ? 'text-red' : ''}">${t.error_count}</div></div>
        <div><div class="mini-label">Error Rate</div><div class="mini-value">${errRate}</div></div>
        <div><div class="mini-label">Avg Latency</div><div class="mini-value">${formatLatency(t.avg_latency)}</div></div>
        <div><div class="mini-label">Traffic</div><div class="mini-value">${formatBytes(total)}</div></div>
        <div><div class="mini-label">Running</div><div class="mini-value">${timeAgo(t.connected_at)}</div></div>
      </div>
    </div>
    <div class="table-wrap">
      <div class="table-header">
        <span class="table-title">Request Log</span>
        <div style="flex:1"></div>
        <input id="filter-path" class="filter-input" placeholder="Filter path..." value="${esc(searchPath)}" oninput="renderDetail()">
        <select id="filter-method" class="filter-input" onchange="renderDetail()">
          <option value="ALL" ${filterMethod==='ALL'?'selected':''}>All Methods</option>
          ${['GET','POST','PUT','PATCH','DELETE','HEAD','OPTIONS'].map(m => `<option value="${m}" ${filterMethod===m?'selected':''}>${m}</option>`).join('')}
        </select>
        <select id="filter-status" class="filter-input" onchange="renderDetail()">
          <option value="ALL" ${filterStatus==='ALL'?'selected':''}>All Status</option>
          <option value="2xx" ${filterStatus==='2xx'?'selected':''}>2xx</option>
          <option value="3xx" ${filterStatus==='3xx'?'selected':''}>3xx</option>
          <option value="4xx" ${filterStatus==='4xx'?'selected':''}>4xx</option>
          <option value="5xx" ${filterStatus==='5xx'?'selected':''}>5xx</option>
        </select>
        <button class="btn btn-default" onclick="clearLogs()" title="Clear all logs">🗑 Clear</button>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Method</th><th>Path</th><th>Status</th><th>Type</th><th>Latency</th><th>Size</th><th>Time</th><th></th></tr></thead>
          <tbody>
            ${filtered.length === 0
              ? '<tr><td colspan="8" class="empty-row">No requests yet</td></tr>'
              : filtered.map(r => {
                const ct = r.response_headers ? (Object.entries(r.response_headers).find(([k]) => k.toLowerCase() === 'content-type') || [])[1] : null;
                const ctLabel = contentTypeShort(ct ? (Array.isArray(ct) ? ct[0] : ct) : '');
                return `<tr class="clickable" onclick="showDetail(${r.id})">
                  <td><span class="method-badge ${methodClass(r.method)}">${r.method}</span></td>
                  <td class="mono text-muted" style="font-size:.75rem;max-width:20rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.path)}">${esc(r.path)}</td>
                  <td class="mono ${statusClass(r.status)}">${r.status}</td>
                  <td class="text-dim" style="font-size:.7rem">${ctLabel}</td>
                  <td class="text-muted">${formatLatency(r.latency_ms)}</td>
                  <td class="text-muted" style="font-size:.75rem">${formatBytes(r.bytes_in + r.bytes_out)}</td>
                  <td class="text-muted" style="font-size:.75rem">${timeAgo(r.created_at)}</td>
                  <td style="white-space:nowrap;display:flex;gap:2px">
                    <button class="btn-icon" title="Replay" onclick="event.stopPropagation();replayRequest(${r.id})">↻</button>
                    <button class="btn-icon" title="Copy cURL" onclick="event.stopPropagation();copyCurl(${r.id})">⎘</button>
                    <button class="btn-icon" title="Edit & Resend" onclick="event.stopPropagation();openComposerFrom(${r.id})">✎</button>
                  </td>
                </tr>`;
              }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

async function clearLogs() {
  try {
    await fetch(API + '/api/stats/clear', { method: 'POST' });
    requests = [];
    renderDetail();
    toast('Logs cleared');
  } catch (e) { toast('Failed to clear: ' + e.message); }
}

async function copyCurl(id) {
  try {
    const res = await fetch(API + '/api/stats/curl/' + id);
    const data = await res.json();
    await navigator.clipboard.writeText(data.curl);
    toast('cURL copied to clipboard');
  } catch (e) { toast('Failed to copy: ' + e.message); }
}
</script>
<script>
// --- KV pair helpers ---
function renderKVEditor(list, prefix, keyPlaceholder, valuePlaceholder) {
  let html = '';
  list.forEach((item, i) => {
    html += `<div class="kv-row">
      <input type="checkbox" class="kv-toggle" ${item.enabled ? 'checked' : ''} onchange="${prefix}Toggle(${i}, this.checked)">
      <input placeholder="${keyPlaceholder}" value="${esc(item.key)}" oninput="${prefix}Set(${i},'key',this.value)" style="${!item.enabled?'opacity:.5':''}">
      <input placeholder="${valuePlaceholder}" value="${esc(item.value)}" oninput="${prefix}Set(${i},'value',this.value)" style="${!item.enabled?'opacity:.5':''}">
      <button class="kv-remove" onclick="${prefix}Remove(${i})" title="Remove">×</button>
    </div>`;
  });
  html += `<button class="kv-add" onclick="${prefix}Add()">+ Add</button>`;
  return html;
}

// Params KV
function compParamsToggle(i, v) { comp.params[i].enabled = v; renderComposer(); }
function compParamsSet(i, k, v) { comp.params[i][k] = v; }
function compParamsRemove(i) { comp.params.splice(i, 1); if (comp.params.length === 0) comp.params.push({key:'',value:'',enabled:true}); renderComposer(); }
function compParamsAdd() { comp.params.push({key:'',value:'',enabled:true}); renderComposer(); }

// Headers KV
function compHeadersToggle(i, v) { comp.headers[i].enabled = v; renderComposer(); }
function compHeadersSet(i, k, v) { comp.headers[i][k] = v; }
function compHeadersRemove(i) { comp.headers.splice(i, 1); if (comp.headers.length === 0) comp.headers.push({key:'',value:'',enabled:true}); renderComposer(); }
function compHeadersAdd() { comp.headers.push({key:'',value:'',enabled:true}); renderComposer(); }

// --- Composer tab ---
function renderComposer() {
  const t = tunnels.find(x => x.subdomain === selectedTunnel);
  if (!t) return;

  const bodyEditors = {
    none: '',
    json: `<textarea id="comp-body" oninput="comp.body=this.value" placeholder='{"key": "value"}' style="min-height:8rem">${esc(comp.body)}</textarea>`,
    form: `<textarea id="comp-body" oninput="comp.body=this.value" placeholder="key=value&amp;other=data" style="min-height:4rem">${esc(comp.body)}</textarea>`,
    raw: `<textarea id="comp-body" oninput="comp.body=this.value" placeholder="raw body content" style="min-height:8rem">${esc(comp.body)}</textarea>`,
  };

  const respHTML = composerResult ? `
    <div class="resp-panel">
      <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem">
        <span style="font-size:.8rem;font-weight:600;color:var(--muted)">Response</span>
        <span class="mono ${statusClass(composerResult.status)}" style="font-weight:700;font-size:1rem">${composerResult.status}</span>
        <span class="text-muted" style="font-size:.75rem">${formatLatency(composerResult.latency_ms)}</span>
        <span class="text-muted" style="font-size:.75rem">${formatBytes((composerResult.body||'').length)}</span>
      </div>
      <div style="margin-bottom:.5rem">
        <div class="composer-label">Response Headers</div>
        ${renderHeaders(composerResult.headers)}
      </div>
      <div>
        <div class="composer-label">Response Body</div>
        ${renderBody(composerResult.body)}
      </div>
    </div>` : '';

  const savedHTML = savedRequests.length > 0 ? `
    <div style="margin-bottom:1rem">
      <div class="composer-label">Saved Requests</div>
      ${savedRequests.map(s => `
        <div class="saved-item" onclick="loadSaved(${s.id})">
          <span class="method-badge ${methodClass(s.method)}">${s.method}</span>
          <span class="saved-name" title="${esc(s.path)}">${esc(s.name || s.path)}</span>
          <button class="saved-delete" onclick="event.stopPropagation();deleteSaved(${s.id})" title="Delete">×</button>
        </div>
      `).join('')}
    </div>` : '';

  document.getElementById('tab-composer').innerHTML = `
    ${savedHTML}
    <div class="composer">
      <div class="composer-row">
        <select id="comp-method" class="filter-input" style="flex:0 0 auto;width:110px" onchange="comp.method=this.value">
          ${['GET','POST','PUT','PATCH','DELETE','HEAD','OPTIONS'].map(m => `<option ${comp.method===m?'selected':''}>${m}</option>`).join('')}
        </select>
        <input id="comp-path" class="filter-input" value="${esc(comp.path)}" placeholder="/api/endpoint" oninput="comp.path=this.value" style="flex:1">
        <button class="btn-send" onclick="sendComposer()" ${composerSending?'disabled':''}>${composerSending ? 'Sending...' : 'Send'}</button>
      </div>

      <div style="display:flex;gap:1.5rem;margin-top:.5rem">
        <div style="flex:1">
          <div class="composer-label">Query Parameters</div>
          ${renderKVEditor(comp.params, 'compParams', 'key', 'value')}
        </div>
      </div>

      <div style="margin-top:.75rem">
        <div class="composer-label">Headers</div>
        ${renderKVEditor(comp.headers, 'compHeaders', 'Header name', 'Header value')}
      </div>

      <div style="margin-top:.75rem">
        <div class="composer-label">Body</div>
        <div style="display:flex;gap:.5rem;margin-bottom:.5rem">
          ${['none','json','form','raw'].map(bt => `
            <button class="btn ${comp.bodyType===bt ? 'btn-live' : 'btn-default'}" onclick="comp.bodyType='${bt}';${bt==='json'?`if(!comp.headers.find(h=>h.key.toLowerCase()==='content-type'))comp.headers.push({key:'Content-Type',value:'application/json',enabled:true});`:''}renderComposer()">${bt === 'none' ? 'None' : bt.toUpperCase()}</button>
          `).join('')}
        </div>
        ${bodyEditors[comp.bodyType]}
      </div>

      <div style="margin-top:.75rem;display:flex;gap:.5rem;align-items:center">
        <input id="comp-name" class="filter-input" placeholder="Request name (for saving)" value="${esc(comp.name)}" oninput="comp.name=this.value" style="flex:1">
        <button class="btn btn-default" onclick="saveRequest()">Save</button>
        <button class="btn btn-default" onclick="resetComposer()">Clear</button>
      </div>
      ${respHTML}
    </div>`;
}

function resetComposer() {
  comp = { method:'GET', path:'/', params:[{key:'',value:'',enabled:true}], headers:[{key:'',value:'',enabled:true}], bodyType:'none', body:'', name:'' };
  composerResult = null;
  renderComposer();
}

async function sendComposer() {
  const t = tunnels.find(x => x.subdomain === selectedTunnel);
  if (!t) return;

  // Build path with query params
  let path = comp.path;
  const activeParams = comp.params.filter(p => p.enabled && p.key);
  if (activeParams.length > 0) {
    const qs = activeParams.map(p => encodeURIComponent(p.key) + '=' + encodeURIComponent(p.value)).join('&');
    path += (path.includes('?') ? '&' : '?') + qs;
  }

  // Build headers
  const headers = {};
  comp.headers.filter(h => h.enabled && h.key).forEach(h => {
    headers[h.key] = [h.value];
  });

  // Auto-set content-type for body types
  if (comp.bodyType === 'json' && !Object.keys(headers).find(k => k.toLowerCase() === 'content-type')) {
    headers['Content-Type'] = ['application/json'];
  } else if (comp.bodyType === 'form' && !Object.keys(headers).find(k => k.toLowerCase() === 'content-type')) {
    headers['Content-Type'] = ['application/x-www-form-urlencoded'];
  }

  composerSending = true;
  renderComposer();

  try {
    const res = await fetch(API + '/api/stats/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subdomain: t.subdomain, method: comp.method, path, headers, body: comp.bodyType !== 'none' ? comp.body : '' })
    });
    if (!res.ok) { toast('Send failed: ' + await res.text()); return; }
    composerResult = await res.json();
  } catch (e) { toast('Send error: ' + e.message); }
  finally { composerSending = false; renderComposer(); }
}

async function saveRequest() {
  const name = comp.name || comp.method + ' ' + comp.path;
  const payload = {
    name, method: comp.method, path: comp.path,
    params: comp.params.filter(p => p.key),
    headers: comp.headers.filter(h => h.key),
    body_type: comp.bodyType, body: comp.body
  };
  try {
    const res = await fetch(API + '/api/stats/saved', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) { toast('Save failed'); return; }
    toast('Request saved');
    await fetchSaved();
    renderComposer();
  } catch (e) { toast('Save error: ' + e.message); }
}

async function loadSaved(id) {
  const s = savedRequests.find(x => x.id === id);
  if (!s) return;
  comp.method = s.method || 'GET';
  comp.path = s.path || '/';
  comp.params = (s.params && s.params.length) ? s.params : [{key:'',value:'',enabled:true}];
  comp.headers = (s.headers && s.headers.length) ? s.headers : [{key:'',value:'',enabled:true}];
  comp.bodyType = s.body_type || 'none';
  comp.body = s.body || '';
  comp.name = s.name || '';
  composerResult = null;
  renderComposer();
}

async function deleteSaved(id) {
  try {
    await fetch(API + '/api/stats/saved/' + id, { method: 'DELETE' });
    await fetchSaved();
    renderComposer();
    toast('Deleted');
  } catch (e) { toast('Delete error: ' + e.message); }
}

function openComposerFrom(id) {
  const r = requests.find(x => String(x.id) === String(id));
  if (!r) return;
  closeModal();
  comp.method = r.method;
  // Parse path and query params
  const [basePath, qs] = (r.path || '/').split('?');
  comp.path = basePath;
  comp.params = [{key:'',value:'',enabled:true}];
  if (qs) {
    const pairs = qs.split('&').map(p => { const [k,...v] = p.split('='); return {key:decodeURIComponent(k),value:decodeURIComponent(v.join('=')),enabled:true}; });
    comp.params = pairs.length ? pairs : [{key:'',value:'',enabled:true}];
  }
  comp.headers = [{key:'',value:'',enabled:true}];
  if (r.request_headers) {
    const pairs = Object.entries(r.request_headers).map(([k,v]) => ({key:k, value:Array.isArray(v)?v.join(', '):v, enabled:true}));
    if (pairs.length) comp.headers = pairs;
  }
  comp.body = r.request_body || '';
  comp.bodyType = comp.body ? 'raw' : 'none';
  // Detect JSON body
  if (comp.body) {
    try { JSON.parse(comp.body); comp.bodyType = 'json'; } catch {}
  }
  comp.name = '';
  composerResult = null;
  switchContentTab('composer');
}
</script>
<script>
// --- Intercepts tab ---
function renderIntercepts() {
  const pausedKeys = Object.keys(pausedReqs);
  const pausedHTML = pausedKeys.length > 0 ? pausedKeys.map(id => {
    const pr = pausedReqs[id];
    const req = pr.Request || pr.request || {};
    return `
    <div class="paused-banner">
      <div class="paused-banner-head">
        <span style="display:flex;align-items:center;gap:.5rem">
          <span style="color:var(--yellow)">⏸</span>
          <span class="method-badge ${methodClass(req.method || 'GET')}">${req.method || '?'}</span>
          <code class="mono" style="font-size:.8rem">${esc(req.path || id)}</code>
        </span>
        <span style="display:flex;gap:.375rem">
          <button class="btn btn-default" style="font-size:.7rem" onclick="editAndResume('${esc(id)}')">✎ Edit & Resume</button>
          <button class="btn btn-default" style="font-size:.7rem" onclick="resumeReq('${esc(id)}')">▶ Resume</button>
        </span>
      </div>
      <div class="paused-detail">
        ${req.headers ? '<span class="text-dim">Headers: ' + Object.keys(req.headers).length + ' keys</span>' : ''}
      </div>
    </div>`;
  }).join('') : '';

  const rulesHTML = interceptRules.length === 0
    ? '<div style="color:var(--dim);text-align:center;padding:2rem">No intercept rules. Create one below.</div>'
    : interceptRules.map(r => `
      <div class="intercept-card ${r.enabled ? '' : 'disabled'}">
        <div class="intercept-info">
          <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
            <span class="intercept-pattern">${esc(r.path_pattern)}</span>
            ${r.methods && r.methods.length ? '<span class="text-muted" style="font-size:.7rem">' + r.methods.join(', ') + '</span>' : ''}
            ${r.add_latency_ms ? '<span class="text-dim" style="font-size:.65rem">+' + r.add_latency_ms + 'ms</span>' : ''}
          </div>
        </div>
        <span class="intercept-action ia-${r.action}">${r.action}</span>
        <button class="btn-sm btn-default" onclick="toggleIntercept(${r.id}, ${!r.enabled})">${r.enabled ? 'Disable' : 'Enable'}</button>
        <button class="btn-sm btn-danger" onclick="deleteIntercept(${r.id})">✕</button>
      </div>`).join('');

  document.getElementById('tab-intercepts').innerHTML = `
    ${pausedHTML}
    <div style="font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem">Active Rules</div>
    ${rulesHTML}
    <div class="composer" style="margin-top:1rem">
      <div class="composer-label">Add Intercept Rule</div>
      <div class="composer-row">
        <input id="ic-pattern" class="filter-input" placeholder="Path regex, e.g. /api/.*" style="flex:2">
        <select id="ic-action" class="filter-input" style="flex:0 0 auto;width:160px">
          <option value="pause">Pause (breakpoint)</option>
          <option value="modify-request">Modify Request</option>
          <option value="modify-response">Modify Response</option>
          <option value="mock">Mock Response</option>
        </select>
      </div>
      <div class="composer-row">
        <input id="ic-methods" class="filter-input" placeholder="Methods (comma-sep, empty=all)" style="flex:1">
        <input id="ic-latency" class="filter-input" placeholder="Add latency (ms)" style="flex:0 0 auto;width:140px" type="number" min="0">
        <input id="ic-status" class="filter-input" placeholder="Override status" style="flex:0 0 auto;width:130px" type="number">
      </div>
      <div class="composer-label">Override Headers <span class="text-dim">(one per line, Key: Value)</span></div>
      <textarea id="ic-headers" placeholder="X-Custom: value" style="min-height:3rem"></textarea>
      <div class="composer-label" style="margin-top:.5rem">Override Body</div>
      <textarea id="ic-body" placeholder='{"mocked": true}' style="min-height:3rem"></textarea>
      <button class="btn-send" style="margin-top:.75rem" onclick="addIntercept()">Add Rule</button>
    </div>`;
}

async function addIntercept() {
  const pattern = document.getElementById('ic-pattern').value;
  if (!pattern) { toast('Path pattern is required'); return; }
  const methodsRaw = document.getElementById('ic-methods').value;
  const methods = methodsRaw ? methodsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];
  const action = document.getElementById('ic-action').value;
  const statusVal = parseInt(document.getElementById('ic-status').value) || 0;
  const latencyVal = parseInt(document.getElementById('ic-latency').value) || 0;
  const headersRaw = document.getElementById('ic-headers').value;
  const setHeaders = {};
  headersRaw.split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx > 0) setHeaders[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
  });
  const setBody = document.getElementById('ic-body').value;
  try {
    const res = await fetch(API + '/api/stats/intercepts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path_pattern: pattern, methods, action, set_headers: setHeaders, set_status: statusVal, set_body: setBody, add_latency_ms: latencyVal, enabled: true })
    });
    if (!res.ok) { toast('Failed: ' + await res.text()); return; }
    toast('Rule added');
    fetchIntercepts();
  } catch (e) { toast('Error: ' + e.message); }
}

async function toggleIntercept(id, enabled) {
  const rule = interceptRules.find(r => r.id === id);
  if (!rule) return;
  rule.enabled = enabled;
  try {
    await fetch(API + '/api/stats/intercepts/' + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(rule)
    });
    fetchIntercepts();
  } catch (e) { toast('Error: ' + e.message); }
}

async function deleteIntercept(id) {
  try {
    await fetch(API + '/api/stats/intercepts/' + id, { method: 'DELETE' });
    fetchIntercepts();
  } catch (e) { toast('Error: ' + e.message); }
}

async function resumeReq(id) {
  try {
    await fetch(API + '/api/stats/resume/' + id, { method: 'POST' });
    toast('Resumed');
    fetchIntercepts();
  } catch (e) { toast('Error: ' + e.message); }
}

function editAndResume(id) {
  const pr = pausedReqs[id];
  if (!pr) return;
  const req = pr.Request || pr.request || {};
  // Show a modal to edit the paused request before resuming
  let editMethod = req.method || 'GET';
  let editPath = req.path || '/';
  let editHeaders = '';
  if (req.headers) {
    editHeaders = Object.entries(req.headers).map(([k,v]) => k + ': ' + (Array.isArray(v) ? v.join(', ') : v)).join('\n');
  }
  let editBody = '';
  // body is base64 in the paused request
  if (req.body) {
    try { editBody = atob(req.body); } catch { editBody = req.body; }
  }

  const el = document.getElementById('modal-root');
  el.innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()" style="max-width:650px">
        <div class="modal-head">
          <div class="modal-head-title">
            <span style="color:var(--yellow)">⏸</span>
            <span style="font-size:.875rem;font-weight:600">Edit Paused Request</span>
          </div>
          <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="composer-row">
            <select id="edit-method" class="filter-input" style="width:100px">
              ${['GET','POST','PUT','PATCH','DELETE','HEAD','OPTIONS'].map(m => `<option ${editMethod===m?'selected':''}>${m}</option>`).join('')}
            </select>
            <input id="edit-path" class="filter-input" value="${esc(editPath)}" style="flex:1">
          </div>
          <div class="composer-label">Headers</div>
          <textarea id="edit-headers" style="min-height:5rem">${esc(editHeaders)}</textarea>
          <div class="composer-label" style="margin-top:.5rem">Body</div>
          <textarea id="edit-body" style="min-height:5rem">${esc(editBody)}</textarea>
          <div style="margin-top:.75rem;display:flex;gap:.5rem">
            <button class="btn-send" onclick="submitEditResume('${esc(id)}')">▶ Resume with Changes</button>
            <button class="btn btn-default" onclick="closeModal()">Cancel</button>
          </div>
        </div>
      </div>
    </div>`;
  el.style.display = 'block';
}

async function submitEditResume(id) {
  const method = document.getElementById('edit-method').value;
  const path = document.getElementById('edit-path').value;
  const headersRaw = document.getElementById('edit-headers').value;
  const body = document.getElementById('edit-body').value;
  const headers = {};
  headersRaw.split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx > 0) {
      const k = line.slice(0, idx).trim();
      const v = line.slice(idx + 1).trim();
      if (!headers[k]) headers[k] = [];
      headers[k].push(v);
    }
  });
  try {
    await fetch(API + '/api/stats/resume/' + id, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ method, path, headers, body })
    });
    toast('Resumed with edits');
    closeModal();
    fetchIntercepts();
  } catch (e) { toast('Error: ' + e.message); }
}
</script>
<script>
// --- Detail modal ---
let modalTab = 'req-headers';

function showDetail(id) {
  const r = requests.find(x => String(x.id) === String(id));
  if (!r) return;
  modalTab = 'req-headers';
  renderModal(r);
}

function renderModal(r) {
  const tabs = [
    { key: 'req-headers', label: 'Request Headers' },
    { key: 'req-body', label: 'Request Body' },
    { key: 'resp-headers', label: 'Response Headers' },
    { key: 'resp-body', label: 'Response Body' },
  ];

  let content = '';
  if (modalTab === 'req-headers') content = renderHeaders(r.request_headers);
  else if (modalTab === 'resp-headers') content = renderHeaders(r.response_headers);
  else if (modalTab === 'req-body') content = renderBody(r.request_body);
  else if (modalTab === 'resp-body') content = renderBody(r.response_body);

  const ct = r.response_headers ? (Object.entries(r.response_headers).find(([k]) => k.toLowerCase() === 'content-type') || [])[1] : null;
  const ctLabel = ct ? (Array.isArray(ct) ? ct[0] : ct) : '';

  const el = document.getElementById('modal-root');
  el.innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head">
          <div class="modal-head-title">
            <span class="method-badge ${methodClass(r.method)}">${r.method}</span>
            <span class="mono" style="font-size:.875rem;color:var(--input-text);max-width:350px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.path)}">${esc(r.path)}</span>
            <span class="mono ${statusClass(r.status)}" style="font-size:.875rem">${r.status}</span>
            <span class="text-muted" style="font-size:.75rem">${formatLatency(r.latency_ms)}</span>
            <span class="text-muted" style="font-size:.75rem">${formatBytes(r.bytes_in + r.bytes_out)}</span>
            ${ctLabel ? `<span class="text-dim" style="font-size:.65rem">${esc(ctLabel.split(';')[0])}</span>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:.375rem">
            <button class="btn-icon" title="Replay" onclick="replayRequest(${r.id})">↻</button>
            <button class="btn-icon" title="Copy cURL" onclick="copyCurl(${r.id})">⎘</button>
            <button class="btn-icon" title="Edit & Resend" onclick="openComposerFrom(${r.id})">✎</button>
            <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
          </div>
        </div>
        <div class="modal-tabs">
          ${tabs.map(t => `<button class="modal-tab ${modalTab === t.key ? 'active' : ''}" onclick="switchModalTab('${t.key}', ${r.id})">${t.label}</button>`).join('')}
        </div>
        <div class="modal-body">${content}</div>
      </div>
    </div>`;
  el.style.display = 'block';
}

function renderHeaders(headers) {
  if (!headers || Object.keys(headers).length === 0) return '<div class="body-empty">No headers</div>';
  let rows = '';
  for (const [k, vals] of Object.entries(headers)) {
    const v = Array.isArray(vals) ? vals.join(', ') : vals;
    rows += `<tr><td class="hdr-key">${esc(k)}</td><td class="hdr-val">${esc(v)}</td></tr>`;
  }
  return `<table class="hdr-table">${rows}</table>`;
}

function renderBody(body) {
  if (!body) return '<div class="body-empty">No body</div>';
  let display = body;
  try { display = JSON.stringify(JSON.parse(body), null, 2); } catch {}
  return `<div style="position:relative"><pre class="body-pre">${esc(display)}</pre><button class="btn-icon" style="position:absolute;top:.5rem;right:.5rem" title="Copy body" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(display))});toast('Copied')">⎘</button></div>`;
}

function switchModalTab(tab, id) {
  modalTab = tab;
  const r = requests.find(x => x.id === id);
  if (r) renderModal(r);
}

function closeModal(e) {
  if (e && e.target && !e.target.classList.contains('modal-overlay')) return;
  document.getElementById('modal-root').style.display = 'none';
  document.getElementById('modal-root').innerHTML = '';
}

// --- Replay ---
async function replayRequest(id) {
  try {
    const res = await fetch(API + '/api/stats/replay/' + id, { method: 'POST' });
    if (!res.ok) { toast('Replay failed: ' + await res.text()); return; }
    const data = await res.json();
    if (selectedTunnel) await fetchRequests(selectedTunnel);
    renderDetail();
    showReplayResult(data);
  } catch (e) { toast('Replay error: ' + e.message); }
}

function showReplayResult(data) {
  const el = document.getElementById('modal-root');
  window._replayData = data;
  let replayTab = 'headers';

  function renderReplayModal() {
    const content = replayTab === 'headers' ? renderHeaders(data.headers) : renderBody(data.body);
    el.innerHTML = `
      <div class="modal-overlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-head">
            <div class="modal-head-title">
              <span style="font-size:.875rem;font-weight:600">Replay Result</span>
              <span class="mono ${statusClass(data.status)}" style="font-size:.875rem">${data.status}</span>
              <span class="text-muted" style="font-size:.75rem">${formatLatency(data.latency_ms)}</span>
              <span class="text-muted" style="font-size:.75rem">${formatBytes((data.body||'').length)}</span>
            </div>
            <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
          </div>
          <div class="modal-tabs">
            <button class="modal-tab ${replayTab==='headers'?'active':''}" onclick="window._switchReplay('headers')">Headers</button>
            <button class="modal-tab ${replayTab==='body'?'active':''}" onclick="window._switchReplay('body')">Body</button>
          </div>
          <div class="modal-body">${content}</div>
        </div>
      </div>`;
    el.style.display = 'block';
  }

  window._switchReplay = function(tab) { replayTab = tab; renderReplayModal(); };
  renderReplayModal();
}

// --- Auto-refresh ---
function toggleAutoRefresh() {
  autoRefresh = !autoRefresh;
  const btn = document.getElementById('btn-live');
  const dot = document.getElementById('live-dot');
  const txt = document.getElementById('live-text');
  if (autoRefresh) {
    btn.className = 'btn btn-live'; dot.style.background = 'var(--green)';
    dot.classList.add('pulse'); txt.textContent = 'Live'; startInterval();
  } else {
    btn.className = 'btn btn-paused'; dot.style.background = 'var(--muted)';
    dot.classList.remove('pulse'); txt.textContent = 'Paused'; stopInterval();
  }
}

function startInterval() {
  stopInterval();
  intervalId = setInterval(() => {
    fetchAll();
    if (selectedTunnel) {
      fetchRequests(selectedTunnel);
      if (contentTab === 'intercepts') fetchIntercepts();
    }
  }, 2000);
}
function stopInterval() { if (intervalId) { clearInterval(intervalId); intervalId = null; } }

async function refresh() { await fetchAll(); if (selectedTunnel) await fetchRequests(selectedTunnel); }

// --- Theme ---
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  if (isDark) {
    html.removeAttribute('data-theme');
    document.getElementById('btn-theme').textContent = '☀️';
    try { localStorage.setItem('theme', 'light'); } catch {}
  } else {
    html.setAttribute('data-theme', 'dark');
    document.getElementById('btn-theme').textContent = '🌙';
    try { localStorage.setItem('theme', 'dark'); } catch {}
  }
}
(function() {
  try {
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('btn-theme').textContent = '🌙';
    }
  } catch {}
})();

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// Boot
fetchAll().then(() => { toggleAutoRefresh(); });
</script>
</body>
</html>
